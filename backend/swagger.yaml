# ─── COMPONENTS ──────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Enums ──────────────────────────────────────────────────────────────
    OPDRoom:
      type: string
      enum:
        - OPD_CLINIC_ROOM
        - DRESSING_ROOM
        - INJECTION_ROOM
        - BLEEDING_ROOM
        - ANIMAL_BITE_ROOM
        - DISPENSARY_ROOM

    AppointmentStatus:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - SERVING
        - COMPLETED
        - CANCELLED
        - SKIPPED
        - NO_SHOW

    UserRole:
      type: string
      enum: [PATIENT, DOCTOR, STAFF, ADMIN]

    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED]

    StaffFunction:
      type: string
      enum: [REGISTRATION, NURSE, QUEUE_MANAGEMENT]

    # ── User / Auth ─────────────────────────────────────────────────────────
    SignupRequest:
      type: object
      required: [full_name, nic, password]
      properties:
        full_name:
          type: string
        nic:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
          minLength: 6
        gender:
          type: string
        date_of_birth:
          type: string
          format: date
        address:
          type: string
        district:
          type: string

    LoginRequest:
      type: object
      required: [nic, password]
      properties:
        nic:
          type: string
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            token:
              type: string
            user:
              $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: uint
        full_name:
          type: string
        nic:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        gender:
          type: string
        date_of_birth:
          type: string
        civil_status:
          type: string
        address:
          type: string
        district:
          type: string
        emergency_contact_name:
          type: string
        emergency_contact_phone:
          type: string
        blood_group:
          type: string
        allergies:
          type: string
        medical_conditions:
          type: string
        created_at:
          type: string
          format: date-time

    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/UserProfile'

    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
        phone:
          type: string
        gender:
          type: string
        date_of_birth:
          type: string
          format: date
        civil_status:
          type: string
        address:
          type: string
        district:
          type: string
        emergency_contact_name:
          type: string
        emergency_contact_phone:
          type: string
        blood_group:
          type: string
        allergies:
          type: string
        medical_conditions:
          type: string

    # ── Appointments ────────────────────────────────────────────────────────
    BookAppointmentRequest:
      type: object
      required: [room, appointment_date]
      properties:
        room:
          $ref: '#/components/schemas/OPDRoom'
        appointment_date:
          type: string
          format: date
          description: Appointment date in YYYY-MM-DD format
        notes:
          type: string

    AppointmentItem:
      type: object
      properties:
        id:
          type: integer
          format: uint
        patient_id:
          type: integer
          format: uint
        patient_name:
          type: string
        patient_nic:
          type: string
        patient_phone:
          type: string
        room:
          $ref: '#/components/schemas/OPDRoom'
        queue_number:
          type: integer
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          example: '08:00'
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        is_priority:
          type: boolean
        notes:
          type: string
        qr_code_data:
          type: string
        created_at:
          type: string
          format: date-time

    AppointmentDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AppointmentItem'

    AppointmentListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentItem'

    RoomsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            properties:
              key:
                $ref: '#/components/schemas/OPDRoom'
              display_name:
                type: string

    QueueStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            room:
              $ref: '#/components/schemas/OPDRoom'
            room_display_name:
              type: string
            waiting:
              type: integer
            serving:
              type: integer
            completed:
              type: integer
            current_number:
              type: integer
            average_wait_minutes:
              type: integer

    # ── Medical Records ─────────────────────────────────────────────────────
    MedicalRecord:
      type: object
      properties:
        id:
          type: integer
          format: uint
        patient_id:
          type: integer
          format: uint
        title:
          type: string
        record_type:
          type: string
          enum: [PRESCRIPTION, LAB_RESULT, SCAN, DOCTOR_NOTE, OTHER]
        file_url:
          type: string
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    MedicalRecordResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/MedicalRecord'

    MedicalRecordListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/MedicalRecord'

    DoctorRecordRequest:
      type: object
      required: [patient_nic, title, notes]
      properties:
        patient_nic:
          type: string
        title:
          type: string
        notes:
          type: string
        record_type:
          type: string
          enum: [PRESCRIPTION, LAB_RESULT, SCAN, DOCTOR_NOTE, OTHER]

    # ── Chat ────────────────────────────────────────────────────────────────
    ChatMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ChatMessage:
      type: object
      properties:
        id:
          type: integer
          format: uint
        user_id:
          type: integer
          format: uint
        role:
          type: string
          enum: [user, assistant]
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminStaffRequest'
      responses:
        '200':
          description: Staff updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a staff profile and deactivate its linked login
      description: Soft-deletes the staff profile and linked user account. Historical queue records are retained.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Staff profile and linked login were deactivated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AdminUser:
      type: object
      required: [id, full_name, nic, phone, role, status, created_at]
      properties:
        id:
          type: integer
          format: uint
        full_name:
          type: string
        nic:
          type: string
        phone:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          type: string
          format: date-time

    AdminUserListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/AdminUser'
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
              format: int64
            total_pages:
              type: integer

    AdminUpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'

    AdminUserResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/AdminUser'

    # ── Admin – Appointments ────────────────────────────────────────────────
    AdminAppointment:
      type: object
      required: [id, appointment_date, appointment_time, patient_name, room, queue_number, status]
      properties:
        id:
          type: integer
          format: uint
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          example: '08:00'
        patient_name:
          type: string
        patient_nic:
          type: string
        patient_phone:
          type: string
        room:
          $ref: '#/components/schemas/OPDRoom'
        room_display_name:
          type: string
        queue_number:
          type: integer
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    AdminAppointmentListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            appointments:
              type: array
              items:
                $ref: '#/components/schemas/AdminAppointment'
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
              format: int64
            total_pages:
              type: integer

    AdminUpdateAppointmentRequest:
      type: object
      minProperties: 1
      properties:
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        room:
          $ref: '#/components/schemas/OPDRoom'
        status:
          type: string
          enum: [PENDING, CONFIRMED, SERVING, COMPLETED, CANCELLED]
    AdminAppointmentResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/AdminAppointment'

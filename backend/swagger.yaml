openapi: 3.0.0
info:
  title: MediQ OPD Queue & Appointment API
  description: API documentation for MediQ OPD Appointment Booking & Queue Management System
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local Server
paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: API is healthy
  /auth/login:
    post:
      summary: User Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nic, password]
              properties:
                nic:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
  /appointments:
    get:
      summary: Get list of appointments
      responses:
        '200':
          description: List of appointments retrieved
    post:
      summary: Create new appointment
      responses:
        '201':
          description: Appointment created successfully
  /queue/status:
    get:
      summary: Get live queue status
      responses:
        '200':
          description: Queue status retrieved
  /admin/dashboard:
    get:
      summary: Get admin dashboard stats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard stats retrieved successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users:
    get:
      summary: List and search users
      description: Returns users with the fields needed by the admin user-management screen.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Search by name, NIC, phone, or user ID.
          schema:
            type: string
        - name: role
          in: query
          required: false
          description: Filter by managed user role. Patient accounts are never returned.
          schema:
            type: string
            enum: [DOCTOR, STAFF, ADMIN]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/users/{id}:
    patch:
      summary: Update a user's role or account status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric user ID
          schema:
            type: integer
            format: uint
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/appointments:
    get:
      summary: List and search appointments
      description: Monitor appointments and filter by date, service, status, patient details, or appointment ID.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Search by patient name, NIC, phone, or appointment ID.
          schema:
            type: string
        - name: date
          in: query
          required: false
          description: Appointment date in YYYY-MM-DD format.
          schema:
            type: string
            format: date
        - name: service
          in: query
          required: false
          schema:
            type: string
            enum: [OPD_CLINIC_ROOM, DRESSING_ROOM, INJECTION_ROOM, BLEEDING_ROOM, ANIMAL_BITE_ROOM]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, CONFIRMED, SERVING, COMPLETED, CANCELLED]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Appointments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAppointmentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/appointments/{id}:
    patch:
      summary: Manage an appointment
      description: Cancel, change status, or reschedule an appointment by changing its date, time, or service.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric appointment ID
          schema:
            type: integer
            format: uint
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateAppointmentRequest'
      responses:
        '200':
          description: Appointment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAppointmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/queues:
    get:
      summary: Monitor all OPD queues and detect congestion
      description: Returns waiting, serving, completed, average wait, congestion status, and recommended actions for all six queues.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: Queue date in YYYY-MM-DD format. Defaults to today in Sri Lanka time.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Queue metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQueueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/analytics:
    get:
      summary: Get compact queue and appointment analytics
      description: >-
        Returns daily or weekly appointment outcomes and per-service queue metrics.
        Average wait uses scheduled time to service start when available. Peak waiting
        is the largest persisted pending/confirmed count for a service on one day.
        A congestion incident is a service-day with more than 20 waiting appointments.
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
      responses:
        '200':
          description: Analytics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/doctors:
    get:
      summary: List managed doctors
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Search by doctor name, specialization, or SLMC number.
          schema:
            type: string
      responses:
        '200':
          description: Doctors retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminDoctor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Add a doctor profile to an existing doctor user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDoctorRequest'
      responses:
        '201':
          description: Doctor added successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/doctors/{id}:
    patch:
      summary: Edit, assign, activate, or deactivate a doctor
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDoctorRequest'
      responses:
        '200':
          description: Doctor updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a doctor profile and deactivate its linked login
      description: Soft-deletes the doctor profile and linked user account. Historical appointment records are retained.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Doctor profile and linked login were deactivated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/staff:
    get:
      summary: List managed staff
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Staff retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminStaff'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Add a staff profile to an existing staff user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminStaffRequest'
      responses:
        '201':
          description: Staff added successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/staff/{id}:
    patch:
      summary: Edit, assign, activate, or deactivate a staff profile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminStaffRequest'
      responses:
        '200':
          description: Staff updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a staff profile and deactivate its linked login
      description: Soft-deletes the staff profile and linked user account. Historical queue records are retained.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Staff profile and linked login were deactivated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AdminUser:
      type: object
      required: [id, full_name, nic, phone, role, status, created_at]
      properties:
        id:
          type: integer
          format: uint
        full_name:
          type: string
        nic:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [DOCTOR, STAFF, ADMIN]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
        created_at:
          type: string
          format: date-time
    AdminUserListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/AdminUser'
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
              format: int64
            total_pages:
              type: integer
    AdminUpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        role:
          type: string
          enum: [DOCTOR, STAFF, ADMIN]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
    AdminUserResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/AdminUser'
    AdminAppointment:
      type: object
      required: [id, appointment_date, appointment_time, patient_name, room, queue_number, status]
      properties:
        id:
          type: integer
          format: uint
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          example: '08:00'
        patient_name:
          type: string
        patient_nic:
          type: string
        patient_phone:
          type: string
        room:
          type: string
          enum: [OPD_CLINIC_ROOM, DRESSING_ROOM, INJECTION_ROOM, BLEEDING_ROOM, ANIMAL_BITE_ROOM]
        room_display_name:
          type: string
        queue_number:
          type: integer
        status:
          type: string
          enum: [PENDING, CONFIRMED, SERVING, COMPLETED, CANCELLED]
        notes:
          type: string
        created_at:
          type: string
          format: date-time
    AdminAppointmentListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            appointments:
              type: array
              items:
                $ref: '#/components/schemas/AdminAppointment'
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
              format: int64
            total_pages:
              type: integer
    AdminUpdateAppointmentRequest:
      type: object
      minProperties: 1
      properties:
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        room:
          type: string
          enum: [OPD_CLINIC_ROOM, DRESSING_ROOM, INJECTION_ROOM, BLEEDING_ROOM, ANIMAL_BITE_ROOM]
        status:
          type: string
          enum: [PENDING, CONFIRMED, SERVING, COMPLETED, CANCELLED]
    AdminAppointmentResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/AdminAppointment'
    AdminQueue:
      type: object
      required: [key, name, waiting, serving, completed, average_wait_minutes, congestion_status, recommended_action]
      properties:
        key:
          type: string
          enum: [OPD_CLINIC_ROOM, DRESSING_ROOM, INJECTION_ROOM, ANIMAL_BITE_ROOM, BLEEDING_ROOM, DISPENSARY_ROOM]
        name:
          type: string
        waiting:
          type: integer
        serving:
          type: integer
        completed:
          type: integer
        average_wait_minutes:
          type: integer
        congestion_status:
          type: string
          enum: [NORMAL, WARNING, CRITICAL]
        recommended_action:
          type: string
    AdminQueueAlert:
      type: object
      required: [queue_key, queue_name, waiting, average_wait_minutes, status, recommended_action]
      properties:
        queue_key:
          type: string
        queue_name:
          type: string
        waiting:
          type: integer
        average_wait_minutes:
          type: integer
        status:
          type: string
          enum: [WARNING, CRITICAL]
        recommended_action:
          type: string
    AdminQueueResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            date:
              type: string
              format: date
            queues:
              type: array
              minItems: 6
              maxItems: 6
              items:
                $ref: '#/components/schemas/AdminQueue'
            alerts:
              type: array
              items:
                $ref: '#/components/schemas/AdminQueueAlert'
    AdminAnalyticsResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            period:
              type: string
              enum: [7d, 30d, 90d]
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
            appointments:
              type: object
              properties:
                bookings:
                  type: integer
                completed:
                  type: integer
                cancelled:
                  type: integer
                missed:
                  type: integer
            queue_services:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  name:
                    type: string
                  average_wait_minutes:
                    type: integer
                  wait_samples:
                    type: integer
                  peak_waiting:
                    type: integer
                  congestion_incidents:
                    type: integer
            trend:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                  start_date:
                    type: string
                    format: date
                  bookings:
                    type: integer
                  completed:
                    type: integer
                  cancelled:
                    type: integer
                  missed:
                    type: integer
    AdminDoctor:
      type: object
      required: [id, user_id, name, specialization, slmc_number, clinic_name, room, status, is_available, current_queue]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        specialization:
          type: string
        slmc_number:
          type: string
        clinic_name:
          type: string
        room:
          type: string
          enum: ['', OPD_CLINIC_ROOM, DRESSING_ROOM, INJECTION_ROOM, BLEEDING_ROOM, ANIMAL_BITE_ROOM]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
        is_available:
          type: boolean
        current_queue:
          type: integer
          format: int64
    AdminDoctorRequest:
      type: object
      required: [user_id, specialization, slmc_number, clinic_name]
      properties:
        user_id:
          type: integer
        specialization:
          type: string
        slmc_number:
          type: string
        clinic_name:
          type: string
        room:
          type: string
          enum: ['', OPD_CLINIC_ROOM, DRESSING_ROOM, INJECTION_ROOM, BLEEDING_ROOM, ANIMAL_BITE_ROOM]
        is_available:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
    AdminStaff:
      type: object
      required: [id, user_id, name, function, assigned_room, status, is_available]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        function:
          type: string
          enum: [REGISTRATION, NURSE, QUEUE_MANAGEMENT]
        assigned_room:
          type: string
          enum: ['', OPD_CLINIC_ROOM, DRESSING_ROOM, INJECTION_ROOM, BLEEDING_ROOM, ANIMAL_BITE_ROOM]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
        is_available:
          type: boolean
    AdminStaffRequest:
      type: object
      required: [user_id, function]
      properties:
        user_id:
          type: integer
        function:
          type: string
          enum: [REGISTRATION, NURSE, QUEUE_MANAGEMENT]
        assigned_room:
          type: string
          enum: ['', OPD_CLINIC_ROOM, DRESSING_ROOM, INJECTION_ROOM, BLEEDING_ROOM, ANIMAL_BITE_ROOM]
        is_available:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
  responses:
    BadRequest:
      description: Invalid request
    Unauthorized:
      description: Missing or invalid authentication token
    Forbidden:
      description: User does not have admin access
    NotFound:
      description: User was not found
    ServerError:
      description: Internal server error

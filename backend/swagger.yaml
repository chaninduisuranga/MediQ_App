openapi: 3.0.0
info:
  title: MediQ OPD Queue & Appointment API
  description: |
    API documentation for MediQ OPD Appointment Booking & Queue Management System.
    
    ## Authentication
    Most endpoints require a Bearer JWT token. Obtain a token via `POST /auth/login`.
    
    ## Roles
    - **PATIENT** – Book & manage own appointments, chat, medical records
    - **STAFF** – Manage OPD queues and check-ins
    - **DOCTOR** – View and update today's patient queue
    - **ADMIN** – Full system management (users, doctors, staff, appointments, queues, FAQs)
  version: 1.0.0
  contact:
    name: MediQ Support

servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server

tags:
  - name: Health
    description: System health check
  - name: Auth
    description: Authentication & user profile
  - name: Appointments
    description: OPD appointment booking & queue viewing
  - name: Medical Records
    description: Patient medical records management
  - name: Chat
    description: AI chatbot conversations
  - name: Staff
    description: Staff queue management operations
  - name: Doctor
    description: Doctor queue management operations
  - name: Admin – Dashboard
    description: Admin dashboard statistics
  - name: Admin – Users
    description: Admin user management
  - name: Admin – Appointments
    description: Admin appointment management
  - name: Admin – Doctors
    description: Admin doctor profile management
  - name: Admin – Staff
    description: Admin staff profile management
  - name: Admin – Queues
    description: Admin queue monitoring
  - name: Admin – Chat FAQs
    description: Admin AI chatbot FAQ management

paths:
  # ─── HEALTH ────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ─── AUTH ──────────────────────────────────────────────────────────────────
  /auth/signup:
    post:
      tags: [Auth]
      summary: Register a new patient account
      operationId: authSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: NIC or email already registered
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with NIC and password
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid NIC or password
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user profile
      operationId: authGetMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/profile:
    put:
      tags: [Auth]
      summary: Update current user profile
      operationId: authUpdateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Auth]
      summary: Delete current user account
      operationId: authDeleteAccount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  # ─── APPOINTMENTS ──────────────────────────────────────────────────────────
  /appointments/rooms:
    get:
      tags: [Appointments]
      summary: Get available OPD rooms
      operationId: appointmentGetRooms
      responses:
        '200':
          description: Available rooms list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomsResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /appointments/queue/{room}:
    get:
      tags: [Appointments]
      summary: Get live queue status for a specific OPD room
      operationId: appointmentGetQueueStatus
      parameters:
        - name: room
          in: path
          required: true
          description: OPD room key
          schema:
            $ref: '#/components/schemas/OPDRoom'
      responses:
        '200':
          description: Live queue status for the room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /appointments/view/{id}:
    get:
      tags: [Appointments]
      summary: View appointment details by ID (public, used by QR scan)
      operationId: appointmentView
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: uint
            minimum: 1
      responses:
        '200':
          description: Appointment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /appointments/book:
    post:
      tags: [Appointments]
      summary: Book a new OPD appointment (patient)
      operationId: appointmentBook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookAppointmentRequest'
      responses:
        '201':
          description: Appointment booked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Conflicting appointment already exists
        '500':
          $ref: '#/components/responses/ServerError'

  /appointments/my:
    get:
      tags: [Appointments]
      summary: Get current user's upcoming appointments
      operationId: appointmentGetMy
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of upcoming appointments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/analytics:
    get:
      summary: Get compact queue and appointment analytics
      description: >-
        Returns daily or weekly appointment outcomes and per-service queue metrics.
        Average wait uses scheduled time to service start when available. Peak waiting
        is the largest persisted pending/confirmed count for a service on one day.
        A congestion incident is a service-day with more than 20 waiting appointments.
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
      responses:
        '200':
          description: Analytics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/doctors:
    get:
      tags: [Appointments]
      summary: Get current patient's appointment history
      operationId: appointmentGetHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Appointment history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /appointments/{id}/cancel:
    put:
      tags: [Appointments]
      summary: Cancel an appointment
      operationId: appointmentCancel
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: uint
            minimum: 1
      responses:
        '200':
          description: Appointment cancelled successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a doctor profile and deactivate its linked login
      description: Soft-deletes the doctor profile and linked user account. Historical appointment records are retained.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Doctor profile and linked login were deactivated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/staff:
    get:
      tags: [Medical Records]
      summary: Get authenticated patient's medical records
      operationId: medicalRecordsGet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Patient medical records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalRecordListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /medical-records/upload:
    post:
      tags: [Medical Records]
      summary: Upload a prescription or document (multipart)
      operationId: medicalRecordsUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file (PDF, image)
                title:
                  type: string
                  description: Record title / description
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /medical-records/doctor:
    post:
      tags: [Medical Records]
      summary: Add a doctor-created medical record entry
      operationId: medicalRecordsAddDoctor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorRecordRequest'
      responses:
        '201':
          description: Record added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /medical-records/{id}:
    delete:
      tags: [Medical Records]
      summary: Delete a medical record
      operationId: medicalRecordsDelete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: uint
            minimum: 1
      responses:
        '200':
          description: Record deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ─── CHAT ──────────────────────────────────────────────────────────────────
  /chat/history:
    get:
      tags: [Chat]
      summary: Get AI chatbot conversation history
      operationId: chatGetHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Chat history retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Chat]
      summary: Clear AI chatbot conversation history
      operationId: chatClearHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Chat history cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /chat/message:
    post:
      tags: [Chat]
      summary: Send a message to the AI chatbot
      operationId: chatSendMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      responses:
        '200':
          description: AI response received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  # ─── STAFF ─────────────────────────────────────────────────────────────────
  /staff/profile:
    get:
      tags: [Staff]
      summary: Get staff profile and assigned room
      operationId: staffGetProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Staff profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /staff/queue/list:
    get:
      tags: [Staff]
      summary: Get today's queue list for staff's assigned room
      operationId: staffGetQueueList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Queue list retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffQueueListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /staff/queue/search:
    get:
      tags: [Staff]
      summary: Search queue entries by patient name, NIC, or queue number
      operationId: staffSearchQueue
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffQueueListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /staff/queue/history:
    get:
      tags: [Staff]
      summary: Get queue activity history for staff's room
      operationId: staffGetQueueHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Queue history retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffQueueListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /staff/queue/checkin/{id}:
    post:
      tags: [Staff]
      summary: Check in a patient (mark as arrived)
      operationId: staffCheckIn
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Appointment ID
          schema:
            type: integer
            format: uint
            minimum: 1
      responses:
        '200':
          description: Patient checked in successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /staff/queue/call/{id}:
    post:
      tags: [Staff]
      summary: Call next patient or a specific patient to the room
      operationId: staffCallNext
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Appointment ID
          schema:
            type: integer
            format: uint
            minimum: 1
      responses:
        '200':
          description: Patient called successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /staff/queue/status/{id}:
    patch:
      tags: [Staff]
      summary: Update appointment status (SERVING, COMPLETED, NO_SHOW, etc.)
      operationId: staffUpdateStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Appointment ID
          schema:
            type: integer
            format: uint
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/AppointmentStatus'
      responses:
        '200':
          description: Status updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /staff/queue/priority/{id}:
    patch:
      tags: [Staff]
      summary: Toggle priority flag for a queued patient
      operationId: staffTogglePriority
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Appointment ID
          schema:
            type: integer
            format: uint
            minimum: 1
      responses:
        '200':
          description: Priority toggled successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /staff/doctors:
    get:
      tags: [Staff]
      summary: Get list of available doctors for the staff's assigned room
      operationId: staffGetDoctors
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Doctors retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDoctorsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /staff/queue/allocate/{id}:
    post:
      tags: [Staff]
      summary: Allocate a doctor to a queued patient
      operationId: staffAllocateDoctor
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Appointment ID
          schema:
            type: integer
            format: uint
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctor_id]
              properties:
                doctor_id:
                  type: integer
                  format: uint
      responses:
        '200':
          description: Doctor allocated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ─── DOCTOR ────────────────────────────────────────────────────────────────
  /doctor/queue/today:
    get:
      tags: [Doctor]
      summary: Get today's patient queue for the logged-in doctor
      operationId: doctorGetTodayQueue
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Today's queue retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorQueueResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /doctor/queue/stats:
    get:
      tags: [Doctor]
      summary: Get queue statistics for the logged-in doctor
      operationId: doctorGetQueueStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Queue statistics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorQueueStatsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /doctor/queue/{id}/status:
    patch:
      tags: [Doctor]
      summary: Update appointment status from doctor's view
      operationId: doctorUpdateAppointmentStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Appointment ID
          schema:
            type: integer
            format: uint
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/AppointmentStatus'
      responses:
        '200':
          description: Status updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ─── ADMIN – DASHBOARD ─────────────────────────────────────────────────────
  /admin/dashboard:
    get:
      tags: [Admin – Dashboard]
      summary: Get admin dashboard statistics
      operationId: adminGetDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  # ─── ADMIN – USERS ─────────────────────────────────────────────────────────
  /admin/users:
    get:
      tags: [Admin – Users]
      summary: List and search managed users (DOCTOR, STAFF, ADMIN)
      operationId: adminListUsers
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Search by name, NIC, phone, or user ID
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [DOCTOR, STAFF, ADMIN]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query

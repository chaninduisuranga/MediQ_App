openapi: 3.0.0
info:
  title: MediQ OPD Queue & Appointment API
  description: API documentation for MediQ OPD Appointment Booking & Queue Management System
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local Server
paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: API is healthy
  /auth/login:
    post:
      summary: User Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nic, password]
              properties:
                nic:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
  /appointments:
    get:
      summary: Get list of appointments
      responses:
        '200':
          description: List of appointments retrieved
    post:
      summary: Create new appointment
      responses:
        '201':
          description: Appointment created successfully
  /queue/status:
    get:
      summary: Get live queue status
      responses:
        '200':
          description: Queue status retrieved
  /admin/dashboard:
    get:
      summary: Get admin dashboard stats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard stats retrieved successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users:
    get:
      summary: List and search users
      description: Returns users with the fields needed by the admin user-management screen.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Search by name, NIC, phone, or user ID.
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/users/{id}:
    patch:
      summary: Update a user's role or account status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric user ID
          schema:
            type: integer
            format: uint
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/appointments:
    get:
      summary: List and search appointments
      description: Monitor appointments and filter by date, service, status, patient details, or appointment ID.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Search by patient name, NIC, phone, or appointment ID.
          schema:
            type: string
        - name: date
          in: query
          required: false
          description: Appointment date in YYYY-MM-DD format.
          schema:
            type: string
            format: date
        - name: service
          in: query
          required: false
          schema:
            type: string
            enum: [OPD_CLINIC_ROOM, DRESSING_ROOM, INJECTION_ROOM, BLEEDING_ROOM, ANIMAL_BITE_ROOM]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Appointments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAppointmentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/appointments/{id}:
    patch:
      summary: Manage an appointment
      description: Cancel, change status, or reschedule an appointment by changing its date, time, or service.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric appointment ID
          schema:
            type: integer
            format: uint
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateAppointmentRequest'
      responses:
        '200':
          description: Appointment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAppointmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AdminUser:
      type: object
      required: [id, full_name, nic, phone, role, status, created_at]
      properties:
        id:
          type: integer
          format: uint
        full_name:
          type: string
        nic:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [PATIENT, DOCTOR, STAFF, ADMIN]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
        created_at:
          type: string
          format: date-time
    AdminUserListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/AdminUser'
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
              format: int64
            total_pages:
              type: integer
    AdminUpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        role:
          type: string
          enum: [PATIENT, DOCTOR, STAFF, ADMIN]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
    AdminUserResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/AdminUser'
    AdminAppointment:
      type: object
      required: [id, appointment_date, appointment_time, patient_name, room, queue_number, status]
      properties:
        id:
          type: integer
          format: uint
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          example: '08:00'
        patient_name:
          type: string
        patient_nic:
          type: string
        patient_phone:
          type: string
        room:
          type: string
          enum: [OPD_CLINIC_ROOM, DRESSING_ROOM, INJECTION_ROOM, BLEEDING_ROOM, ANIMAL_BITE_ROOM]
        room_display_name:
          type: string
        queue_number:
          type: integer
        status:
          type: string
          enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED]
        notes:
          type: string
        created_at:
          type: string
          format: date-time
    AdminAppointmentListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            appointments:
              type: array
              items:
                $ref: '#/components/schemas/AdminAppointment'
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
              format: int64
            total_pages:
              type: integer
    AdminUpdateAppointmentRequest:
      type: object
      minProperties: 1
      properties:
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        room:
          type: string
          enum: [OPD_CLINIC_ROOM, DRESSING_ROOM, INJECTION_ROOM, BLEEDING_ROOM, ANIMAL_BITE_ROOM]
        status:
          type: string
          enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED]
    AdminAppointmentResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/AdminAppointment'
  responses:
    BadRequest:
      description: Invalid request
    Unauthorized:
      description: Missing or invalid authentication token
    Forbidden:
      description: User does not have admin access
    NotFound:
      description: User was not found
    ServerError:
      description: Internal server error

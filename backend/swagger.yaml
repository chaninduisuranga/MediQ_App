openapi: 3.0.0
info:
  title: MediQ OPD Queue & Appointment API
  description: API documentation for MediQ OPD Appointment Booking & Queue Management System
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local Server
paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: API is healthy
  /auth/login:
    post:
      summary: User Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
  /appointments:
    get:
      summary: Get list of appointments
      responses:
        '200':
          description: List of appointments retrieved
    post:
      summary: Create new appointment
      responses:
        '201':
          description: Appointment created successfully
  /queue/status:
    get:
      summary: Get live queue status
      responses:
        '200':
          description: Queue status retrieved
